<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Home Page</title>
</head>

<body>

  <header>
    <div th:insert="~{ fragments/fragments :: navbar }" />
  </header>

  <main>
    <div class="container">
      <form th:action="@{/pizze/create}" method="post">
        <div class="row" th:object="${pizza}">
          <div class="col-12">
            <label for="name">Nome Pizza</label>
            <input id="name" type="text" class="form-control" th:field="*{name}" th:errorClass="is-invalid">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
              <ul>
                <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
              </ul>
            </div>
          </div>
          <div class="col-12">
            <label for="description">Descrizione</label>
            <input id="description" type="text" class="form-control" th:field="*{description}"
              th:errorClass="is-invalid">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
              <ul>
                <li th:each="error : ${#fields.errors('description')}" th:text="${error}" />
              </ul>
            </div>
          </div>
          <div class="col-12">
            <label for="img">Url Immagine</label>
            <input id="img" type="text" class="form-control" th:field="*{img}" th:errorClass="is-invalid">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('img')}">
              <ul>
                <li th:each="error : ${#fields.errors('img')}" th:text="${error}" />
              </ul>
            </div>
          </div>
          <div class="col-12">
            <label for="price">Prezzo</label>
            <input id="price" type="number" class="form-control" th:field="*{price}" th:errorClass="is-invalid">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}">
              <ul>
                <li th:each="error : ${#fields.errors('price')}" th:text="${error}" />
              </ul>
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Crea</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
