<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Edit or Create Offer</title>
</head>

<body>

  <header>
    <div th:insert="~{ fragments/fragments :: navbar }" />
  </header>

  <main>
    <div class="container">

      <section>
        <th:block>
          <div class="row mt-3">
            <h1 th:unless="${edit}">Crea ingrediente</h1>
            <h1 th:if="${edit}">Modifica ingrediente</h1>
          </div>
        </th:block>
      </section>

      <section th:object="${ingredient}">
        <form th:action="${edit} ? @{|/ingredients/edit/*{id}|} : @{/ingredients/create}" method="post">
          <div class="row">

            <!-- <input type="hidden" th:field="*{pizza.id}"> -->

            <div class="col-12">
              <label for="name">Nome Ingrediente</label>
              <input id="name" type="text" class="form-control" th:field="*{name}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                <ul>
                  <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                </ul>
              </div>
            </div>
            <div class="col-12">
              <button th:unless="${edit}" type="submit" class="btn btn-primary">Crea</button>
              <button th:if="${edit}" type="submit" class="btn btn-primary">Modifica</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
